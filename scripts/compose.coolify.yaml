services:
  memos:
    build:
      context: ..
      dockerfile: scripts/Dockerfile.coolify
    restart: unless-stopped
    environment:
      MEMOS_DRIVER: sqlite
      MEMOS_DATA: /var/opt/memos
      MEMOS_PORT: "5230"
      MEMOS_INSTANCE_URL: ${MEMOS_INSTANCE_URL:-}
      TZ: ${TZ:-Europe/Copenhagen}
    expose:
      - "5230"
    volumes:
      - memos-data:/var/opt/memos
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5230/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  memos-data:
    external: true
    name: ${MEMOS_VOLUME_NAME:?Set MEMOS_VOLUME_NAME to the existing Memos Docker volume}
